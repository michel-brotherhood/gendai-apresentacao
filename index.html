<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="Estratégia de conteúdo digital — Gendai Premium">
  <title>Gendai Premium · Estratégia de conteúdo digital</title>
  <style>
    :root {
      --paper: #f7f6f1;
      --ink: #403e3e;
      --muted: #6f6c6c;
      --line: #a9a6a0;
      --accent: #86133e;
      --accent-dark: #5f0f2e;
      --panel: rgba(247, 246, 241, .92);
      --stage-w: min(100vw, 1440px);
      --stage-h: calc(var(--stage-w) * .5625);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      background: #e9e7e0;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    button { font: inherit; }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 18px 22px;
    }

    .topbar {
      width: min(100%, 1440px);
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: var(--ink);
    }

    .brand {
      display: flex;
      flex-direction: column;
      min-width: 0;
      line-height: 1.12;
    }

    .brand strong {
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand span {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .top-button,
    .nav-button {
      border: 1px solid rgba(64, 62, 62, .42);
      background: rgba(247, 246, 241, .82);
      color: var(--ink);
      cursor: pointer;
      transition: background-color .16s ease, color .16s ease, border-color .16s ease, transform .16s ease;
    }

    .top-button {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 2px;
      font-size: 12px;
      letter-spacing: .01em;
    }

    .top-button:hover,
    .top-button:focus-visible,
    .nav-button:hover,
    .nav-button:focus-visible {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
      outline: none;
    }

    .top-button:active,
    .nav-button:active { transform: scale(.97); }

    .stage-wrap {
      position: relative;
      width: min(100%, 1440px);
      margin-top: 4px;
      box-shadow: 0 12px 42px rgba(38, 35, 31, .17);
      background: var(--paper);
    }

    .stage-wrap:fullscreen {
      width: 100vw;
      height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--paper);
      box-shadow: none;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--paper);
      overflow: hidden;
      touch-action: pan-y;
    }

    .stage-wrap:fullscreen .stage {
      width: min(100vw, 177.777778vh);
      height: min(56.25vw, 100vh);
      aspect-ratio: 16 / 9;
    }

    .slide {
      position: absolute;
      inset: 0;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--paper);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .slide.is-active {
      opacity: 1;
      pointer-events: auto;
    }

    .slide-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .video-layer {
      position: absolute;
      /* Dimensões do objeto de vídeo original na página 12 do PPTX. */
      left: 2.85693%;
      top: 10.04524%;
      width: 72.97191%;
      height: 72.99291%;
      background: #fff;
      pointer-events: none;
    }

    .video-layer video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #fff;
    }

    .video-label {
      position: absolute;
      left: 14px;
      top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      color: #fff;
      background: rgba(64, 62, 62, .82);
      font-size: 11px;
      letter-spacing: .04em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .video-label::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d93467;
      box-shadow: 0 0 0 3px rgba(217, 52, 103, .22);
    }

    .slide.is-active[data-slide="12"] .video-layer { pointer-events: none; }

    .slide.is-active[data-slide="12"] .video-label { display: inline-flex; }

    .video-controls {
      position: absolute;
      left: 14px;
      bottom: 14px;
      display: none;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .slide.is-active[data-slide="12"] .video-controls { display: flex; }

    .video-control {
      min-height: 32px;
      padding: 0 11px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 2px;
      background: rgba(64,62,62,.82);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      transition: background-color .16s ease, transform .16s ease;
    }

    .video-control:hover,
    .video-control:focus-visible { background: var(--accent); outline: none; }
    .video-control:active { transform: scale(.97); }

    .hud {
      width: min(100%, 1440px);
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: var(--muted);
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      font-size: 12px;
    }

    .progress strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: min(280px, 32vw);
      height: 2px;
      background: rgba(64,62,62,.22);
      overflow: hidden;
    }

    .progress-fill {
      width: 7.142857%;
      height: 100%;
      background: var(--accent);
      transition: width .18s ease;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-button {
      min-width: 38px;
      height: 34px;
      border-radius: 2px;
      font-size: 16px;
      line-height: 1;
    }

    .hint {
      width: min(100%, 1440px);
      color: #7b7771;
      font-size: 11px;
      text-align: right;
      line-height: 1.4;
    }

    .hint kbd {
      display: inline-block;
      min-width: 22px;
      padding: 1px 5px;
      border: 1px solid rgba(64,62,62,.22);
      background: rgba(247,246,241,.66);
      color: var(--ink);
      font-family: inherit;
      font-size: 10px;
      text-align: center;
    }

    @media (max-width: 720px) {
      .app { padding: 10px 8px 14px; }
      .topbar { min-height: 42px; }
      .brand strong { font-size: 10px; }
      .brand span { font-size: 9px; }
      .top-button { min-height: 30px; padding: 0 8px; font-size: 10px; }
      .stage-wrap { margin-top: 2px; }
      .hud { min-height: 48px; }
      .progress { gap: 7px; font-size: 10px; }
      .progress-track { width: 24vw; }
      .nav-button { min-width: 34px; height: 30px; }
      .hint { font-size: 9px; }
      .video-label { left: 8px; top: 8px; padding: 5px 7px; font-size: 8px; }
      .video-controls { left: 8px; bottom: 8px; gap: 5px; }
      .video-control { min-height: 28px; padding: 0 8px; font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide, .progress-fill, .top-button, .nav-button, .video-control { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar" aria-label="Controles da apresentação">
      <div class="brand">
        <strong>Gendai Premium</strong>
        <span>Estratégia de conteúdo digital · Setembro/26</span>
      </div>
      <div class="top-actions">
        <button class="top-button" id="soundButton" type="button" aria-pressed="false">Ativar som</button>
        <button class="top-button" id="fullscreenButton" type="button">Tela cheia</button>
      </div>
    </header>

    <section class="stage-wrap" aria-label="Apresentação">
      <div class="stage" id="stage" tabindex="0">
        <figure class="slide is-active" data-slide="1" aria-label="Página 1 de 14">
          <img class="slide-image" src="slides/slide-01.png" alt="Capa: Estratégia de conteúdo digital">
        </figure>
        <figure class="slide" data-slide="2" aria-label="Página 2 de 14" aria-hidden="true">
          <img class="slide-image" src="slides/slide-02.png" alt="Agenda">
        </figure>
        <figure class="slide" data-slide="3" aria-label="Página 3 de 14" aria-hidden="true">
          <img class="slide-image" src="slides/slide-03.png" alt="Debriefing">
        </figure>
        <figure class="slide" data-slide="4" aria-label="Página 4 de 14" aria-hidden="true">
          <img class="slide-image" src="slides/slide-04.png" alt="Redes sociais: posicionamento">
        </figure>
        <figure class="slide" data-slide="5" aria-label="Página 5 de 14" aria-hidden="true">
          <img class="slide-image" src="slides/slide-05.png" alt="Redes sociais: Instagram e público">
        </figure>
        <figure class="slide" data-slide="6" aria-label="Página 6 de 14" aria-hidden="true">
          <img class="slide-image" src="slides/slide-06.png" alt="Redes sociais: crescimento e oportunidades">
        </figure>
        <figure class="slide" data-slide="7" aria-label="Página 7 de 14" aria-hidden="true">
          <img class="slide-image" src="slides/slide-07.png" alt="Nosso público">
        </figure>
        <figure class="slide" data-slide="8" aria-label="Página 8 de 14" aria-hidden="true">
          <img class="slide-image" src="slides/slide-08.png" alt="Nuvem de palavras">
        </figure>
        <figure class="slide" data-slide="9" aria-label="Página 9 de 14" aria-hidden="true">
          <img class="slide-image" src="slides/slide-09.png" alt="Nossos concorrentes">
        </figure>
        <figure class="slide" data-slide="10" aria-label="Página 10 de 14" aria-hidden="true">
          <img class="slide-image" src="slides/slide-10.png" alt="Nossas inspirações">
        </figure>
        <figure class="slide" data-slide="11" aria-label="Página 11 de 14" aria-hidden="true">
          <img class="slide-image" src="slides/slide-11.png" alt="Editorial">
        </figure>
        <figure class="slide" data-slide="12" aria-label="Página 12 de 14" aria-hidden="true">
          <img class="slide-image" src="slides/slide-12.png" alt="Layout do Instagram e diretrizes visuais">
          <div class="video-layer" aria-label="Vídeo Gendai Premium">
            <video id="presentationVideo" loop muted autoplay playsinline preload="auto" poster="media/video-poster.jpg">
              <source src="media/gendaicsom.mp4" type="video/mp4">
              Seu navegador não suporta vídeo HTML5.
            </video>
            <div class="video-controls">
              <button class="video-control" id="videoSoundButton" type="button" aria-pressed="false">Ativar som</button>
              <button class="video-control" id="videoPlayButton" type="button">Pausar</button>
            </div>
          </div>
        </figure>
        <figure class="slide" data-slide="13" aria-label="Página 13 de 14" aria-hidden="true">
          <img class="slide-image" src="slides/slide-13.png" alt="Próximos passos">
        </figure>
        <figure class="slide" data-slide="14" aria-label="Página 14 de 14" aria-hidden="true">
          <img class="slide-image" src="slides/slide-14.png" alt="Obrigada">
        </figure>
      </div>
    </section>

    <footer class="hud" aria-label="Navegação da apresentação">
      <div class="progress">
        <strong id="pageLabel">01 / 14</strong>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
        <span id="pageName">Capa</span>
      </div>
      <nav class="nav" aria-label="Páginas">
        <button class="nav-button" id="prevButton" type="button" aria-label="Página anterior">←</button>
        <button class="nav-button" id="nextButton" type="button" aria-label="Próxima página">→</button>
      </nav>
    </footer>
    <div class="hint">Use <kbd>←</kbd> <kbd>→</kbd> ou deslize para navegar · na página 12, clique em <strong>Ativar som</strong> para ouvir o vídeo</div>
  </main>

  <script>
    (() => {
      const totalSlides = 14;
      const pageNames = [
        'Capa', 'Agenda', 'Debriefing', 'Redes sociais', 'Redes sociais',
        'Redes sociais', 'Nosso público', 'Nuvem de palavras', 'Nossos concorrentes',
        'Nossas inspirações', 'Editorial', 'Layout', 'Próximos passos', 'Obrigada'
      ];
      const slides = [...document.querySelectorAll('.slide')];
      const stage = document.getElementById('stage');
      const video = document.getElementById('presentationVideo');
      const pageLabel = document.getElementById('pageLabel');
      const pageName = document.getElementById('pageName');
      const progressFill = document.getElementById('progressFill');
      const prevButton = document.getElementById('prevButton');
      const nextButton = document.getElementById('nextButton');
      const soundButton = document.getElementById('soundButton');
      const videoSoundButton = document.getElementById('videoSoundButton');
      const videoPlayButton = document.getElementById('videoPlayButton');
      const fullscreenButton = document.getElementById('fullscreenButton');
      let current = 1;
      let touchStartX = null;

      const clamp = (n, min, max) => Math.min(Math.max(n, min), max);

      function setSoundState(isMuted) {
        const label = isMuted ? 'Ativar som' : 'Silenciar';
        soundButton.textContent = label;
        soundButton.setAttribute('aria-pressed', String(!isMuted));
        videoSoundButton.textContent = label;
        videoSoundButton.setAttribute('aria-pressed', String(!isMuted));
      }

      function tryPlay() {
        if (!video) return;
        const result = video.play();
        if (result && typeof result.catch === 'function') {
          result.catch(() => {
            // Autoplay com áudio pode ser bloqueado; nesse caso, reproduzimos em silêncio.
            if (!video.muted) {
              video.muted = true;
              setSoundState(true);
              const mutedResult = video.play();
              if (mutedResult && typeof mutedResult.catch === 'function') mutedResult.catch(() => {});
            }
          });
        }
      }

      function unlockAudio() {
        if (!video) return;
        video.muted = false;
        video.volume = 1;
        setSoundState(false);
        tryPlay();
      }

      function updateVideoForPage(page) {
        if (!video) return;
        if (page === 12) {
          tryPlay();
        } else {
          video.pause();
        }
      }

      function render(page, options = {}) {
        const nextPage = clamp(Number(page) || 1, 1, totalSlides);
        const previous = current;
        current = nextPage;
        slides.forEach((slide, index) => {
          const active = index + 1 === current;
          slide.classList.toggle('is-active', active);
          slide.setAttribute('aria-hidden', String(!active));
        });
        pageLabel.textContent = `${String(current).padStart(2, '0')} / ${totalSlides}`;
        pageName.textContent = pageNames[current - 1];
        progressFill.style.width = `${(current / totalSlides) * 100}%`;
        prevButton.disabled = current === 1;
        nextButton.disabled = current === totalSlides;
        prevButton.setAttribute('aria-label', current === 1 ? 'Primeira página' : 'Página anterior');
        nextButton.setAttribute('aria-label', current === totalSlides ? 'Última página' : 'Próxima página');

        if (current === 12 && previous !== 12) {
          video.currentTime = 0;
          if (!options.initial) unlockAudio();
        }
        updateVideoForPage(current);
        const hash = `#${current}`;
        if (window.location.hash !== hash) history.replaceState(null, '', hash);
        stage.focus({ preventScroll: true });
      }

      function go(delta) { render(current + delta); }

      function toggleSound() {
        if (!video) return;
        if (video.muted) unlockAudio();
        else {
          video.muted = true;
          setSoundState(true);
        }
      }

      function togglePlay() {
        if (!video) return;
        if (video.paused) {
          tryPlay();
          videoPlayButton.textContent = 'Pausar';
        } else {
          video.pause();
          videoPlayButton.textContent = 'Reproduzir';
        }
      }

      function updateFullscreenButton() {
        const active = Boolean(document.fullscreenElement);
        fullscreenButton.textContent = active ? 'Sair da tela cheia' : 'Tela cheia';
        fullscreenButton.setAttribute('aria-pressed', String(active));
      }

      prevButton.addEventListener('click', () => go(-1));
      nextButton.addEventListener('click', () => go(1));
      soundButton.addEventListener('click', toggleSound);
      videoSoundButton.addEventListener('click', (event) => {
        event.stopPropagation();
        toggleSound();
      });
      videoPlayButton.addEventListener('click', (event) => {
        event.stopPropagation();
        togglePlay();
      });
      fullscreenButton.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.querySelector('.stage-wrap').requestFullscreen();
        } catch (_) {}
      });
      document.addEventListener('fullscreenchange', updateFullscreenButton);

      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') {
          event.preventDefault();
          go(1);
        } else if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
          event.preventDefault();
          go(-1);
        } else if (event.key.toLowerCase() === 'm') {
          toggleSound();
        } else if (event.key.toLowerCase() === 'f') {
          fullscreenButton.click();
        }
      });

      stage.addEventListener('pointerdown', (event) => {
        touchStartX = event.clientX;
      });
      stage.addEventListener('pointerup', (event) => {
        if (touchStartX === null) return;
        const delta = event.clientX - touchStartX;
        touchStartX = null;
        if (Math.abs(delta) >= 55) go(delta < 0 ? 1 : -1);
      });

      window.addEventListener('hashchange', () => {
        const fromHash = Number(window.location.hash.slice(1));
        if (fromHash >= 1 && fromHash <= totalSlides && fromHash !== current) render(fromHash);
      });

      video.addEventListener('play', () => { videoPlayButton.textContent = 'Pausar'; });
      video.addEventListener('pause', () => { videoPlayButton.textContent = 'Reproduzir'; });

      const initialHash = Number(window.location.hash.slice(1));
      current = clamp(initialHash || 1, 1, totalSlides);
      video.muted = true;
      video.defaultMuted = true;
      setSoundState(true);
      updateFullscreenButton();
      render(current, { initial: true });
    })();
  </script>
</body>
</html>
